name: Verify Calgary Open Data field names

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch one record and print its keys
        run: |
          set -euo pipefail
          curl -sS "https://data.calgary.ca/resource/vdjc-pybd.json?\$limit=1" -o record.json
          echo "--- raw record ---"
          cat record.json
          echo ""
          echo "--- top-level keys ---"
          python3 -c "import json; print(sorted(json.load(open('record.json'))[0].keys()))"
